name: DEEBOT Y1 PRO Diagnostics
version: "1.3.1"
slug: deebot_y1_pro_diagnostics
description: Diagnostic toolkit for DEEBOT Y1 PRO and Home Assistant DEEBOT integrations
url: https://github.com/danielmessem/vacuumReminer
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ports:
  8099/tcp: null
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-vacuum
panel_title: DEEBOT Diagnostics
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
docker_api: true
map:
  - homeassistant_config:rw
  - share:rw
options:
  log_lines: 5000
schema:
  log_lines: int
